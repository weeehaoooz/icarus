<talos-main-layout class="dashboard-shell">

  <!-- ─── Full-Height Left Sidebar (100vh) ──────────────────── -->
  <talos-side-nav
    [showHeader]="true"
    [navGroups]="activeNavGroups()"
    [footerItems]="[]"
    [userProfile]="currentUserProfile()"
    [showThemeToggle]="false"
    [isDarkMode]="themeService.isDark()"
    (itemClick)="onNavItemClick($event.id ?? '')"
    (themeToggle)="themeService.toggle()">
    <!-- Brand slot in sidebar header -->
    <div side-nav-logo class="sidenav-brand">
      <div class="brand-icon" aria-hidden="true">I</div>
      <span class="brand-name">Icarus <span>IAM</span></span>
    </div>
  </talos-side-nav>

  <!-- ─── Right Area (Remainder of Width) ───────────────────── -->
  <div class="main-column-wrapper">

    <!-- Top Navigation spanning the remainder of the width -->
    <talos-top-nav
      [bordered]="true"
      [showBrand]="false"
      [showLogo]="false"
      [showSidebarToggle]="false"
      [showThemeToggle]="true"
      [isDarkMode]="themeService.isDark()"
      (themeToggle)="themeService.toggle()">

      <!-- Left section of top nav: Space Switcher -->
      <div top-nav-left class="top-nav-left-content">
        @if (isAdmin()) {
          <div class="space-switcher" role="radiogroup" aria-label="Workspace Space Switcher">
            <button
              class="switcher-btn"
              [class.active]="currentSpace() === 'user'"
              (click)="setSpace('user')"
              role="radio"
              [attr.aria-checked]="currentSpace() === 'user'"
              aria-label="User Space">
              <svg class="lucide-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
              <span>User Space</span>
            </button>
            <button
              class="switcher-btn"
              [class.active]="currentSpace() === 'admin'"
              (click)="setSpace('admin')"
              role="radio"
              [attr.aria-checked]="currentSpace() === 'admin'"
              aria-label="Admin Console">
              <svg class="lucide-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
              </svg>
              <span>Admin Console</span>
            </button>
          </div>
        } @else {
          <div class="user-space-badge">
            <svg class="lucide-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
            <span>User Space</span>
          </div>
        }
      </div>

      <!-- Right section of top nav: Profile Dropdown -->
      <div top-nav-user class="profile-dropdown-container">
        <button
          class="profile-trigger"
          (click)="toggleProfileDropdown($event)"
          [attr.aria-expanded]="isProfileDropdownOpen()"
          aria-haspopup="menu"
          aria-label="User menu">
          <div class="avatar-circle">{{ username().charAt(0) }}</div>
          <div class="user-meta">
            <span class="user-name">{{ username() }}</span>
            <span class="user-role">{{ isAdmin() ? 'Administrator' : 'Standard User' }}</span>
          </div>
          <svg class="lucide-icon chevron-icon" [class.rotated]="isProfileDropdownOpen()" viewBox="0 0 24 24" aria-hidden="true">
            <polyline points="6 9 12 15 18 9" />
          </svg>
        </button>

        @if (isProfileDropdownOpen()) {
          <ul class="profile-dropdown-menu animate-fade-in" role="menu">
            <li class="dropdown-header">
              <span class="header-name">{{ username() }}</span>
              <span class="header-role">{{ isAdmin() ? 'Administrator' : 'Standard User' }}</span>
            </li>
            <li class="dropdown-divider" role="separator"></li>
            <li role="none">
              <a routerLink="/dashboard/profile-settings" class="dropdown-item" role="menuitem">
                <svg class="lucide-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                  <circle cx="12" cy="7" r="4" />
                </svg>
                <span>My Profile</span>
              </a>
            </li>
            <li class="dropdown-divider" role="separator"></li>
            <li role="none">
              <button (click)="logout()" class="dropdown-item dropdown-item--danger" role="menuitem">
                <svg class="lucide-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                  <polyline points="16 17 21 12 16 7" />
                  <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
                <span>Logout</span>
              </button>
            </li>
          </ul>
        }
      </div>

    </talos-top-nav>

    <!-- Scrollable Page Content Area -->
    <main class="page-content-scroll">
      <router-outlet />
    </main>

  </div>

</talos-main-layout>
