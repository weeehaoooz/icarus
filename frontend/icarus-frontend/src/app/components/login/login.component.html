<section class="login-container">
  <talos-card variant="elevated" padding="lg" class="login-card animate-fade-in">
    <talos-card-body>
      <header class="login-header">
        <h1 class="brand-title">Icarus <span>IAM</span></h1>
        <p class="brand-subtitle">Identity and Access Management Platform</p>
      </header>

      @if (errorMessage()) {
        <talos-alert severity="error" [dismissible]="true" (dismiss)="errorMessage.set(null)" class="login-alert">
          {{ errorMessage() }}
        </talos-alert>
      }

      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="username" class="form-label">Username</label>
          <input
            talosInput
            type="text"
            id="username"
            name="username"
            [(ngModel)]="username"
            placeholder="admin"
            required
            autocomplete="username"
          />
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input
            talosInput
            type="password"
            id="password"
            name="password"
            [(ngModel)]="password"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          />
        </div>

        <button
          talosButton
          variant="primary"
          [fullWidth]="true"
          [loading]="isLoading()"
          type="submit"
          class="login-btn">
          @if (!isLoading()) { Sign In }
        </button>
      </form>
    </talos-card-body>
  </talos-card>
</section>
