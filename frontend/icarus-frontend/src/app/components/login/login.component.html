<section class="login-container">
  <div class="login-theme-toggle">
    <button
      type="button"
      class="theme-toggle-btn"
      (click)="themeService.toggle()"
      [attr.aria-label]="themeService.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
      [attr.title]="themeService.isDark() ? 'Switch to light mode' : 'Switch to dark mode'">
      @if (themeService.isDark()) {
        <svg class="theme-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2"/>
          <path d="M12 20v2"/>
          <path d="m4.93 4.93 1.41 1.41"/>
          <path d="m17.66 17.66 1.41 1.41"/>
          <path d="M2 12h2"/>
          <path d="M20 12h2"/>
          <path d="m6.34 17.66-1.41 1.41"/>
          <path d="m19.07 4.93-1.41 1.41"/>
        </svg>
      } @else {
        <svg class="theme-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
        </svg>
      }
    </button>
  </div>

  <talos-card variant="elevated" padding="lg" class="login-card animate-fade-in">
    <talos-card-body>
      <header class="login-header">
        <svg class="login-brand-logo" viewBox="0 0 32 32" width="52" height="52" fill="none" aria-hidden="true">
          <defs>
            <linearGradient id="icarus-login-primary" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#5eead4" />
              <stop offset="100%" stop-color="#0d9488" />
            </linearGradient>
            <linearGradient id="icarus-login-wing-top" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#2dd4bf" />
              <stop offset="100%" stop-color="#0f766e" />
            </linearGradient>
            <linearGradient id="icarus-login-wing-bottom" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#14b8a6" />
              <stop offset="100%" stop-color="#094d47" />
            </linearGradient>
          </defs>
          <path d="M13 6.5 L2 11.5 C1 17 4.5 21.5 13 20 L13 16 C6.5 17 4.5 14 4.5 12.5 L13 9 Z"
            fill="url(#icarus-login-wing-top)" />
          <path d="M13 18 L6 21 C8 25.5 11 27 13 27.5 L13 23.5 C10.5 23 9 21 9 20.5 L13 19 Z"
            fill="url(#icarus-login-wing-bottom)" />
          <path d="M19 6.5 L30 11.5 C31 17 27.5 21.5 19 20 L19 16 C25.5 17 27.5 14 27.5 12.5 L19 9 Z"
            fill="url(#icarus-login-wing-top)" />
          <path d="M19 18 L26 21 C24 25.5 21 27 19 27.5 L19 23.5 C21.5 23 23 21 23 20.5 L19 19 Z"
            fill="url(#icarus-login-wing-bottom)" />
          <path d="M16 2 L20 6.5 L16 11 L12 6.5 Z" fill="#5eead4" />
          <path d="M14.5 12.5 L17.5 12.5 L17.5 27 L16 29.5 L14.5 27 Z" fill="url(#icarus-login-primary)" />
        </svg>
        <h1 class="brand-title">Icarus <span>IAM</span></h1>
        <p class="brand-subtitle">Identity and Access Management Platform</p>
      </header>

      @if (errorMessage()) {
      <talos-alert severity="error" [dismissible]="true" (dismiss)="errorMessage.set(null)" class="login-alert">
        {{ errorMessage() }}
      </talos-alert>
      }

      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="username" class="form-label">Username</label>
          <input talosInput type="text" id="username" name="username" [(ngModel)]="username" placeholder="admin"
            required autocomplete="username" />
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input talosInput type="password" id="password" name="password" [(ngModel)]="password" placeholder="••••••••"
            required autocomplete="current-password" />
        </div>

        <button talosButton variant="primary" [fullWidth]="true" [loading]="isLoading()" type="submit"
          class="login-btn">
          @if (!isLoading()) { Sign In }
        </button>
      </form>
    </talos-card-body>
  </talos-card>
</section>
