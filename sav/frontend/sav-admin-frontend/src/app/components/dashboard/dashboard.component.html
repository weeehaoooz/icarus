<section class="dashboard-container animate-fade-in">
  <aside class="sidebar" role="navigation" aria-label="Main Navigation">
    <div class="brand-section">
      <div class="brand-icon" aria-hidden="true">S</div>
      <span class="brand-name">SAV <span>Admin</span></span>
    </div>

    <nav class="nav-body">

      <!-- ─── IAM Section ─────────────────────────────────── -->
      <div class="nav-section">
        <span class="nav-section-label">IAM</span>
        <ul class="nav-list" role="list">
          <li class="nav-item">
            <a routerLink="/dashboard/overview" routerLinkActive="active" class="nav-link"
               aria-label="Overview">
              <svg class="lucide-icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
              Overview
            </a>
          </li>
          <li class="nav-item">
            <a routerLink="/dashboard/users" routerLinkActive="active" class="nav-link"
               aria-label="Users">
              <svg class="lucide-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              Users
            </a>
          </li>
          <li class="nav-item">
            <a routerLink="/dashboard/clients" routerLinkActive="active" class="nav-link"
               aria-label="Clients">
              <svg class="lucide-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 16V4a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v12"/><path d="M2 20h20"/><path d="M12 20v-4"/></svg>
              Clients
            </a>
          </li>
          <li class="nav-item">
            <a routerLink="/dashboard/roles" routerLinkActive="active" class="nav-link"
               aria-label="Access Policies">
              <svg class="lucide-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m21 2-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
              Access Policies
            </a>
          </li>
        </ul>
      </div>

      <!-- ─── Modules & Apps Section ─────────────────────── -->
      <div class="nav-section">
        <span class="nav-section-label">Modules &amp; Apps</span>
        <ul class="nav-list" role="list">
          <li class="nav-item">
            <a routerLink="/dashboard/modules" routerLinkActive="active" class="nav-link nav-link--accent"
               aria-label="Modules">
              <svg class="lucide-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m18 16 4-4-4-4"/><path d="m6 8-4 4 4 4"/><path d="m14.5 4-5 16"/></svg>
              Modules
              <span class="nav-accent-dot" aria-hidden="true"></span>
            </a>
          </li>
          <li class="nav-item">
            <a routerLink="/dashboard/applications" routerLinkActive="active" class="nav-link"
               aria-label="Applications">
              <svg class="lucide-icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><path d="M9 3v18"/><path d="M15 3v18"/><path d="M3 9h18"/><path d="M3 15h18"/></svg>
              Applications
            </a>
          </li>
        </ul>
      </div>

      <!-- ─── Platform Section (low-priority) ────────────── -->
      <div class="nav-section nav-section--platform">
        <span class="nav-section-label">Platform</span>
        <ul class="nav-list" role="list">
          <li class="nav-item">
            <a routerLink="/dashboard/tenants" routerLinkActive="active" class="nav-link"
               aria-label="Tenants">
              <svg class="lucide-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
              Tenants
            </a>
          </li>
          <li class="nav-item">
            <button (click)="toggleSettings()" class="nav-link sub-menu-toggle"
                    [class.active-parent]="isSettingsActive()"
                    [attr.aria-expanded]="isSettingsExpanded()"
                    aria-controls="settings-submenu">
              <svg class="lucide-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
              Settings
              <svg class="lucide-icon arrow-icon" [class.rotated]="isSettingsExpanded()" viewBox="0 0 24 24" aria-hidden="true" style="margin-left: auto; width: 14px; height: 14px;"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            @if (isSettingsExpanded()) {
              <ul class="sub-nav-list" id="settings-submenu" role="list">
                <li class="sub-nav-item">
                  <a routerLink="/dashboard/settings/integrations" routerLinkActive="active" class="sub-nav-link">
                    Integrations
                  </a>
                </li>
              </ul>
            }
          </li>
        </ul>
      </div>

    </nav>

    <div class="user-profile-card">
      <div class="user-info">
        <span class="user-name">{{ username() }}</span>
        <span class="user-role">Administrator</span>
      </div>
      <div class="user-actions">
        <!-- Animated theme toggle button -->
        <button
          class="theme-toggle-btn"
          (click)="toggleTheme()"
          [attr.aria-label]="themeService.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
          [attr.aria-pressed]="!themeService.isDark()"
          title="{{ themeService.isDark() ? 'Light mode' : 'Dark mode' }}"
        >
          @if (themeService.isDark()) {
            <!-- Sun icon (switch to light) -->
            <span class="toggle-icon" [class.icon-enter]="toggleAnimState() === 'entering'" [class.icon-exit]="toggleAnimState() === 'exiting'">
              <svg class="lucide-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
            </span>
          } @else {
            <!-- Moon icon (switch to dark) -->
            <span class="toggle-icon" [class.icon-enter]="toggleAnimState() === 'entering'" [class.icon-exit]="toggleAnimState() === 'exiting'">
              <svg class="lucide-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
            </span>
          }
        </button>
        <button (click)="logout()" class="btn btn-secondary logout-btn">
          Logout <svg class="lucide-icon" viewBox="0 0 24 24" aria-hidden="true" style="margin-left: 4px;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <main class="main-content" role="main">
    <router-outlet></router-outlet>
  </main>
</section>
