# Default values for Icarus IAM Microservices Chart

global:
  environment: production
  domain: icarus.example.com

# 1. Auth Microservice Configuration
authMs:
  enabled: true
  replicaCount: 2
  image:
    repository: icarus-auth-ms
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 60

# 2. Admin Microservice Configuration
adminMs:
  enabled: true
  replicaCount: 2
  image:
    repository: icarus-admin-ms
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 8081
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 75

# 3. Workflow Microservice Configuration
workflowMs:
  enabled: true
  replicaCount: 2
  image:
    repository: icarus-workflow-ms
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 8082
  resources:
    requests:
      cpu: 300m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 12
    targetCPUUtilizationPercentage: 70

# 4. Frontend Configuration
frontend:
  enabled: true
  replicaCount: 2
  image:
    repository: icarus-frontend
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 80

# 5. Ingress Controller Rules
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  hosts:
    - host: icarus.local
      paths:
        - path: /api/auth
          pathType: Prefix
          backendService: authMs
        - path: /api/admin
          pathType: Prefix
          backendService: adminMs
        - path: /api/workflow
          pathType: Prefix
          backendService: workflowMs
        - path: /
          pathType: Prefix
          backendService: frontend
