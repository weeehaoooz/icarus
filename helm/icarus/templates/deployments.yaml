{{- if .Values.authMs.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "icarus.fullname" . }}-auth-ms
  labels:
    {{- include "icarus.labels" . | nindent 4 }}
    app: icarus-auth-ms
spec:
  {{- if not .Values.authMs.autoscaling.enabled }}
  replicas: {{ .Values.authMs.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: icarus-auth-ms
  template:
    metadata:
      labels:
        app: icarus-auth-ms
    spec:
      containers:
      - name: auth-ms
        image: "{{ .Values.authMs.image.repository }}:{{ .Values.authMs.image.tag }}"
        imagePullPolicy: {{ .Values.authMs.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.authMs.service.port }}
        env:
        - name: PORT
          value: "{{ .Values.authMs.service.port }}"
        - name: KEYS_DIR
          value: "/app/keys"
        - name: DATABASE_PATH
          value: "/app/data/auth.db"
        resources:
          {{- toYaml .Values.authMs.resources | nindent 10 }}
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.authMs.service.port }}
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.authMs.service.port }}
          initialDelaySeconds: 10
          periodSeconds: 15
---
{{- end }}

